<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>漫画翻译选区</title>
  <link rel="stylesheet" href="glass.css">
  <link rel="stylesheet" href="selection.css">
</head>
<body>
  <div id="selection-glass" data-liquid-glass="ring" aria-hidden="true"></div>
  <div class="edge top"></div><div class="edge left"></div><div class="edge right"></div><div class="edge bottom"></div>
  <div class="selection-label" data-liquid-glass="pill" aria-hidden="true"><span class="selection-dot"></span><span id="dimensions"></span><span id="selectionMode">固定</span></div>
  <div class="grip nw" data-anchor="nw" title="拖动调整选区"></div><div class="grip ne" data-anchor="ne" title="拖动调整选区"></div>
  <div class="grip sw" data-anchor="sw" title="拖动调整选区"></div><div class="grip se" data-anchor="se" title="拖动调整选区"></div>
  <script src="liquid-glass.js"></script>
  <script src="selection.js"></script>
</body>
</html>
