<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>译窗</title>
  <link rel="stylesheet" href="glass.css">
  <link rel="stylesheet" href="frame.css">
</head>

<body>
  <main id="toolbar" data-liquid-glass="toolbar" aria-label="漫画翻译工具栏">
    <header class="heading">
      <span class="app-mark" aria-hidden="true"><svg viewBox="0 0 20 20">
          <path d="M3 4.5h6a2 2 0 0 1 2 2V16a3 3 0 0 0-3-1H3zM11 6.5a2 2 0 0 1 2-2h4V15h-3a3 3 0 0 0-3 1" />
        </svg></span>
      <h1>译窗</h1><span class="heading-hint">拖动工具栏 · 四角调整选区</span>
      <span class="drag-handle" aria-hidden="true">⠿</span>
      <button id="moveSelection" class="text-button" title="将选区移回当前屏幕">选区归位</button>
      <button id="configuration" title="翻译AI配置：选择服务商、模型和 API Key"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2v12M8 2v12M13 2v12"/><path d="M1 5h4M6 11h4M11 6h4"/></svg>翻译AI配置</button>
      <button id="quit" class="icon-button" aria-label="退出应用" title="退出应用">×</button>
    </header>

    <div class="row translation-row">
      <div class="control-group language-group">
        <select id="source" aria-label="源语言" title="源语言">
          <option value="ja">日语</option>
          <option value="en">英语</option>
          <option value="zh">中文</option>
          <option value="ko">韩语</option>
        </select>
        <span class="direction" aria-hidden="true">→</span>
        <select id="target" aria-label="目标语言" title="目标语言">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁体中文</option>
          <option value="en">英语</option>
          <option value="ja">日语</option>
        </select>
      </div>
      <select id="provider" aria-label="翻译引擎" title="翻译引擎">
        <option value="deepseek">DeepSeek</option>
        <option value="openai">OpenAI</option>
        <option value="gemini">Gemini</option>
      </select>
      <span class="spacer"></span>
      <div class="translate-actions"><button id="lock" class="primary" title="翻译选区 · Ctrl+Shift+T"><svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="m8 1 1.7 4.8L14.5 7.5 9.7 9.2 8 14 6.3 9.2 1.5 7.5l4.8-1.7z" />
          </svg><span>翻译选区</span></button>
        <button id="enhanceOcr" title="用 Manga OCR 精读这次选区截图中已找到的全部日文气泡，再更新译文" hidden>加强 OCR</button></div>
      <button id="clear" title="取消任务并清除译文 · Ctrl+Shift+C">清除</button>
    </div>

    <div class="row display-row">
      <select id="mode" aria-label="译文显示方式" title="智能贴合：纯色且能放下时原位显示，其余用旁注">
        <option value="smart">智能贴合</option>
        <option value="cards">全部旁注</option>
      </select>
      <div class="control-group font-group" aria-label="译文字号"><button id="smaller" title="减小译文字号"
          aria-label="减小译文字号">A−</button><span class="divider" aria-hidden="true"></span><button id="larger"
          title="增大译文字号" aria-label="增大译文字号">A+</button></div>
      <button id="reveal" title="显示原漫画 · Ctrl+Shift+O" aria-pressed="false">查看原图</button>
      <button id="interactToggle" title="锁定选区空白区域，避免点到下层网页" aria-pressed="false">锁定选区</button>
      <span class="spacer"></span>
      <select id="glassTone" aria-label="玻璃外观" title="玻璃外观">
        <option value="clear">通透</option>
        <option value="tinted">柔和</option>
      </select>
    </div>

    <div class="row reading-row">
      <div class="segmented" role="group" aria-label="阅读模式"><button id="fixedMode" aria-pressed="true"
          title="固定选区，手动翻译">固定</button><button id="watchMode" aria-pressed="false"
          title="检测翻页，确认后再翻译；不会自动调用翻译">翻页检测</button></div>
      <span id="readingStatus" role="status" aria-live="polite" title="固定选区，按需翻译">固定选区，按需翻译</span>
      <button id="translateCurrent" class="text-button" hidden>翻译当前页</button>
    </div>

    <div id="recovery" class="row recovery-row" hidden>
      <span class="recovery-icon" aria-hidden="true">↺</span><span id="recoveryCount">本页完成 0 / 0</span><span
        class="spacer"></span>
      <button id="retryRemaining" class="text-button" disabled>重试剩余</button><button id="restorePrevious"
        class="text-button" disabled>恢复上一版</button>
    </div>

    <footer class="status-row"><span id="statusDot" aria-hidden="true"></span><span id="status" role="status"
        aria-live="polite">正在启动…</span><span class="shortcut">Ctrl ⇧ T</span></footer>

    <section id="message" role="alert" hidden>
      <div class="message-heading"><strong>暂时无法完成</strong><button id="dismissMessage" class="icon-button"
          aria-label="关闭提示" title="关闭提示">×</button></div>
      <p></p>
    </section>
  </main>
  <script src="liquid-glass.js"></script>
  <script src="frame.js"></script>
</body>

</html>
